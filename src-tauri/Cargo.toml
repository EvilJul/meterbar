[package]
name = "meterbar"
version = "0.1.0"
description = "macOS / Linux tray AI usage panel"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meterbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：与 tauri.conf.json macOSPrivateApi 对齐（Linux 上为 no-op，非 mac 行为仍靠 cfg）。
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# 注意：不能 object_setClass / contentView 迁到 NSPanel（前者 abort，后者 Tao panic）。
# 全屏置顶：早设 Accessory + CanJoinAllApplications + ScreenSaver level（见 lib.rs）。
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSWindow",
  "NSScreen",
  "NSEvent",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSGeometry", "NSString", "objc2-core-foundation"] }
