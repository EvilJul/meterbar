<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meterbar header options preview</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: rgba(28, 32, 40, 0.92);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.45);
      --btn-bg: rgba(255, 255, 255, 0.06);
      --btn-border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, #1a2330 0%, transparent 55%),
        linear-gradient(180deg, #12151b 0%, #0a0c10 100%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 24px;
    }
    h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .row {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .option {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 360px;
    }
    .label {
      font-size: 13px;
      color: var(--muted);
      padding-left: 2px;
    }
    .panel {
      width: 360px;
      border-radius: 14px;
      background: var(--panel);
      border: 0.5px solid var(--panel-border);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.45),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(1.2);
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: #1c222b;
      box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-icon img {
      width: 28px;
      height: 28px;
      display: block;
      object-fit: cover;
    }
    .title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--text);
    }
    .actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 0.5px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .divider {
      height: 0.5px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 14px;
    }
    .ghost {
      height: 56px;
      margin: 12px 14px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 0.5px solid rgba(255, 255, 255, 0.04);
    }
    /* capture targets: top strip only */
    .capture {
      width: 360px;
      border-radius: 14px 14px 0 0;
      background: var(--panel);
      border: 0.5px solid var(--panel-border);
      border-bottom: none;
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    .captures {
      display: none; /* used only when screenshotting individuals */
    }
  </style>
</head>
<body>
  <h1>Header title options</h1>
  <div class="row">
    <div class="option">
      <div class="label">方案 1 · 计量弧圆标 + Meterbar</div>
      <div class="panel" id="opt1">
        <div class="toolbar">
          <div class="brand">
            <div class="brand-icon" aria-hidden="true">
              <img src="../src-tauri/icons/icon.png" alt="" />
            </div>
            <p class="title">Meterbar</p>
          </div>
          <div class="actions">
            <span class="btn" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M11.5 7A4.5 4.5 0 1 1 7 2.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
                <path d="M7 1v2.5h2.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="btn" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.35"/>
                <path d="M7 1.5v1.2M7 11.3v1.2M1.5 7h1.2M11.3 7h1.2M3.05 3.05l.85.85M10.1 10.1l.85.85M3.05 10.95l.85-.85M10.1 3.9l.85-.85" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="ghost"></div>
      </div>
    </div>

    <div class="option">
      <div class="label">方案 2 · 仅字标 Meterbar</div>
      <div class="panel" id="opt2">
        <div class="toolbar">
          <div class="brand">
            <p class="title">Meterbar</p>
          </div>
          <div class="actions">
            <span class="btn" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M11.5 7A4.5 4.5 0 1 1 7 2.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/>
                <path d="M7 1v2.5h2.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="btn" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.35"/>
                <path d="M7 1.5v1.2M7 11.3v1.2M1.5 7h1.2M11.3 7h1.2M3.05 3.05l.85.85M10.1 10.1l.85.85M3.05 10.95l.85-.85M10.1 3.9l.85-.85" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </span>
          </div>
        </div>
        <div class="divider"></div>
        <div class="ghost"></div>
      </div>
    </div>
  </div>
</body>
</html>
